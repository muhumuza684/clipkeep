name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v1.3.2'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create it if it does not exist yet
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ClipKeep $TAG" --notes-file .github/release-notes.md --generate-notes
          fi

  windows:
    name: Build for Windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the version from the tag
        run: npm pkg set version="${TAG#v}"
      - name: Install
        run: npm install
      - name: Build the installer and the portable app
        run: npm run dist
      - name: Attach them to the release
        run: gh release upload "$TAG" dist/ClipKeep-Setup.exe dist/ClipKeep-Portable.exe --clobber

  android:
    name: Build for Android
    needs: create-release
    runs-on: ubuntu-latest
    # The Android build is optional so a problem here never blocks the Windows release.
    continue-on-error: true
    defaults:
      run:
        working-directory: phone
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use the version from the tag
        run: |
          VERSION="${TAG#v}"
          npm pkg set version="$VERSION"
          node -e "const f=require('fs');const a=JSON.parse(f.readFileSync('app.json','utf8'));a.expo.version='$VERSION';f.writeFileSync('app.json',JSON.stringify(a,null,2))"
      - name: Install
        run: npm install
      - name: Create the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: phone/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Attach it to the release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ClipKeep.apk
          gh release upload "$TAG" ClipKeep.apk --clobber
